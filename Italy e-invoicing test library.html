<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italy e-invoicing test library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#18212C; --muted:#586374; --line:#D6DCE4;
  --accent:#1D4C8A; --accent-soft:#E3ECF8; --on-accent:#FFFFFF;
  --ok:#1B7451; --ok-soft:#E3F2EB; --rej:#B0302A; --rej-soft:#FBE9E7; --warn:#8F6200; --warn-soft:#FFF1CF;
  --chk:#566072; --chk-soft:#E9EDF2; --na:#7A8494; --na-soft:#F0F2F5;
  --code-bg:#F7F9FB; --c-key:#1D4C8A; --c-str:#1B7451; --c-num:#9B4A00; --c-lit:#7A3E9D;
  --font:'Titillium Web','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151C; --surface:#18202A; --sunk:#202A36; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2B3643;
    --accent:#86B4F2; --accent-soft:#1E2D43; --on-accent:#0E1620;
    --ok:#62CFA0; --ok-soft:#173128; --rej:#F2918A; --rej-soft:#3A2020; --warn:#E8B95C; --warn-soft:#3A2F15;
    --chk:#AEB8C6; --chk-soft:#252F3B; --na:#8691A1; --na-soft:#1D2630;
    --code-bg:#131A22; --c-key:#86B4F2; --c-str:#62CFA0; --c-num:#F0A867; --c-lit:#C69AE8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --sunk:#202A36; --ink:#E7ECF2; --muted:#9AA6B5; --line:#2B3643;
  --accent:#86B4F2; --accent-soft:#1E2D43; --on-accent:#0E1620;
  --ok:#62CFA0; --ok-soft:#173128; --rej:#F2918A; --rej-soft:#3A2020; --warn:#E8B95C; --warn-soft:#3A2F15;
  --chk:#AEB8C6; --chk-soft:#252F3B; --na:#8691A1; --na-soft:#1D2630;
  --code-bg:#131A22; --c-key:#86B4F2; --c-str:#62CFA0; --c-num:#F0A867; --c-lit:#C69AE8;
  color-scheme:dark;
}
html{box-sizing:border-box;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;min-height:100%;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;
  padding:22px 14px 22px 22px;border-right:1px solid var(--line);background:var(--bg)}
.brand{font-weight:700;font-size:21px;line-height:1.15;margin:0 0 4px}
.brand-sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.nav{list-style:none;margin:0 0 18px;padding:0}
.nav-label{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.nav button{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:8px;text-align:left;background:none;border:0;
  padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.nav button:hover{background:var(--sunk)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.rail-foot{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}

main{padding:30px clamp(18px,4vw,48px) 80px;min-width:0}
.wrap{max-width:1180px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 10px;font-weight:700}
h2{font-size:25px;line-height:1.2;margin:0 0 8px;font-weight:700}
h3{font-size:17px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:19px;color:var(--ink);max-width:62ch}
.muted{color:var(--muted)}
.sect{margin:34px 0 0}

/* the outcome stamp: the one memorable element */
.stamp{display:inline-block;font-weight:700;font-size:13px;line-height:1.25;padding:1px 7px;border:1.5px solid currentColor;border-radius:3px;
  outline:1px solid currentColor;outline-offset:2px;margin:2px 4px 2px 3px;white-space:nowrap;letter-spacing:.01em}
.stamp.ok{color:var(--ok);background:var(--ok-soft)} .stamp.rej{color:var(--rej);background:var(--rej-soft)}
.stamp.warn{color:var(--warn);background:var(--warn-soft)} .stamp.chk{color:var(--chk);background:var(--chk-soft)}
.stamp.na{color:var(--na);background:var(--na-soft);border-style:dashed;outline-style:dashed}

.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 4px}
.legend div{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}

table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:14px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;padding-right:18px}
.tbl{overflow-x:auto}
.tbl table{min-width:560px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
ul.plain{margin:0 0 12px;padding-left:20px;max-width:72ch}
ul.plain li{margin:0 0 6px}

/* parties panel */
.parties{margin:0 0 20px;padding:12px 12px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.parties h2{font-size:17px;margin:0 0 2px}
.parties .hint{font-size:14px;color:var(--muted);margin:0 0 6px;max-width:none}
.parties label{display:block;font-size:14px;color:var(--muted);margin:10px 0 3px}
.parties select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.parties .chk{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;font-size:14px;color:var(--ink);cursor:pointer}
.parties .chk input{margin-top:4px}
.parties .st{font-size:14px;color:var(--muted);margin:12px 0 8px;line-height:1.4;max-width:none}
.parties .st b{color:var(--ink);font-weight:600}
.applied{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:9px 12px;margin:0 0 10px;font-size:15px}
.applied b{font-weight:600}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:7px 12px;margin:0 0 8px;font-size:15px;border-radius:0 6px 6px 0}
.notice.info{border-color:var(--chk);background:var(--chk-soft)}
.mini td,.mini th{font-size:15px;padding:7px 10px 7px 0}
.tag{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);margin-left:4px;white-space:nowrap}
.tag.pa{border-color:var(--warn);color:var(--warn)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0 12px;margin:0 0 6px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.search{flex:1 1 240px;min-width:200px;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:7px 12px;cursor:pointer;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.count{color:var(--muted);font-size:15px;margin-left:auto}

/* case rows */
.cases{list-style:none;margin:0;padding:0}
.case{border-bottom:1px solid var(--line)}
.case-head{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:6px 14px;width:100%;text-align:left;
  background:none;border:0;padding:13px 4px;cursor:pointer}
.case-head:hover{background:var(--sunk)}
.cid{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.ctitle{min-width:0}
.ctitle b{font-weight:600}
.cmeta{display:block;font-size:14px;color:var(--muted)}
.cmeta .t-p::before,.cmeta .t-n::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ok)}
.cmeta .t-n::before{background:var(--rej)}
.fc{color:var(--accent);font-weight:600}
.cstamps{display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:360px}
.chev{display:none}
.case-body{display:none;padding:6px 4px 26px 4px}
.case.open .case-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px}
.case.open .case-head{background:var(--sunk)}
.col-l h3{margin-top:16px} .col-l h3:first-child{margin-top:4px}
.exp{list-style:none;padding:0;margin:0 0 6px}
.exp li{display:flex;gap:8px;align-items:baseline;margin:0 0 7px;max-width:60ch}
.exp .lay{min-width:48px;font-weight:600}
.cert{font-size:13px;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.src a{display:block;margin:0 0 3px;font-size:15px}

/* payload viewer */
.pv{min-width:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;margin:0 0 8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.pv-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pv-note{font-size:15px;color:var(--muted);margin:0 0 8px;max-width:none}
details.diff{margin:0 0 8px;font-size:15px}
details.diff summary{cursor:pointer;color:var(--accent)}
details.diff ul{margin:6px 0 0;padding-left:20px;color:var(--muted)}
details.diff code{font-family:var(--mono);font-size:13px;color:var(--ink)}
pre.code{margin:0;padding:14px 16px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:560px;
  font-family:var(--mono);font-size:13px;line-height:1.55;tab-size:2}
.k{color:var(--c-key)} .s{color:var(--c-str)} .nu{color:var(--c-num)} .l{color:var(--c-lit)}
.empty{padding:34px 4px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:6px;font-size:15px;z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}

@media (max-width: 900px){
  .shell{display:block}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 18px}
  .nav{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin:0 0 10px;scrollbar-width:thin}
  .nav li{flex:0 0 auto} .nav button{white-space:nowrap}
  .nav-label{display:none}
  .case.open .case-body{grid-template-columns:minmax(0,1fr)}
  .case-head{grid-template-columns:54px minmax(0,1fr)}
  .cstamps{grid-column:2;justify-content:flex-start;max-width:none}
  .bar{position:static}
  html{scroll-padding-top:12px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>

    <ul class="nav" id="navTop"></ul>
    <div class="nav-label">Test cases</div>
    <ul class="nav" id="navGroups"></ul>
    <div class="rail-foot">
      <button class="btn" id="themeBtn" type="button">Switch theme</button>
    </div>

  <main id="main" tabindex="-1"></main>
</div>

ocumentReference":"s","receiptDocumentReference":"s","tenderDocumentReference":"s","contractDocumentReference":"s","orderDocumentReference":"s","projectReference":"s","additionalDocumentRefDetails":"a","billFromTaxRegNo":"s","billFromLegalRegNo":"s","billFromLegalName":"s","billFromTradeName":"s","billFromEndpoint":"s","billFromBankAssignedId":"a","billFromStreetName":"s","billFromAdditionalStreetName":"s","billFromCity":"s","billFromPostCode":"s","billFromCountrySubdivision":"s","billFromCountry":"s","billFromContactName":"s","billFromContactTelNumber":"s","billFromContactEmailAddress":"s","billFromBankName":"s","billFromBankCode":"s","billFromBankAccountNumber":"s","billFromBankAccountIban":"s","billToAddSchIdDetails":"a","billFromAddSchIdDetails":"a","billToTaxRegNo":"s","billToLegalRegNo":"s","billToLegalName":"s","billToTradeName":"s","billToEndpoint":"s","billToIdentifier":"s","billToStreetName":"s","billToAdditionalStreetName":"s","billToCity":"s","billToPostCode":"s","billToCountrySubdivision":"s","billToCountry":"s","billToContactName":"s","billToContactTelNumber":"s","billToContactEmailAddress":"s","billToIsPublicSector":"s","paymentDueDate":"s","paymentTerms":"s","paymentTermDetails":"a","paymentDetails":"a","deliveryDate":"s","deliveryTerms":"s","deliveryQuantity":"s","shipToLocation":"s","shipToLocationName":"s","shipToStreetName":"s","shipToAdditionalStreetName":"s","shipToCity":"s","shipToPostCode":"s","shipToAdditionalAddress":"s","shipToCountrySubdivision":"s","shipToCountry":"s","shipToName":"s","partyShipToName":"s","shipmentCountry":"s","shipmentAllowanceCharges":"a","shippingMarks":"s","documentAllowanceDetails":"a","documentChargeDetails":"a","currencyCodeOfAccCurrency":"s","totalTaxableAmountInAccCurrency":"s","totalTaxAmountInAccCurrency":"s","totalDocumentAmount":"s","totalTaxableAmount":"s","totalTaxAmount":"s","prepaidAmount":"s","roundingAmount":"s","paymentAmountDue":"s","custom1":"s","custom2":"s","custom3":"s","custom4":"s","custom5":"s","custom6":"s","custom7":"s","custom8":"s","custom9":"s","custom10":"s","orderDocumentReferenceDate":"s","despatchDate":"s","shippingMethod":"s","grossWeight":"s","netWeight":"s","documentLegalNotes":"s","contractUnit":"s","withholdingDetails":"a","billToCertifiedEmail":"s","billToRecipientCode":"s","billToVatPayability":"s","billToBankName":"s","billToBankCode":"s","billToBankAccountNumber":"s","billToBankAccountIban":"s","items":"a"},"itemBlank":{"serialNumber":"s","name":"s","description":"s","invoicedQuantity":"s","invoicedQuantityUnitCode":"s","unitPrice":"s","netUnitPrice":"s","priceBaseQuantity":"s","allowanceDetails":"a","chargeDetails":"a","lineReferenceDetails":"a","taxCategoryCode":"s","taxRate":"s","taxExemptionReason":"s","taxableAmount":"s","taxAmount":"s","countryOfOrigin":"s","periodStartDate":"s","periodEndDate":"s","buyerIdentification":"s","sellerIdentification":"s","standardIdentification":"s","buyerAccountingReference":"s","purchaseOrderItemReferenceNo":"s","purchaseOrderReferenceID":"s","classificationCodeDetails":"a","additionalPropertyDetails":"a","notes":"s","isService":"s","taxAmountInAccCurrency":"s","lineAmountInAccCurrency":"s","supplyAmount":"s","despatchReferenceId":"s","customItem1":"s","customItem2":"s","customItem3":"s","customItem4":"s","customItem5":"s","customItem6":"s","customItem7":"s","customItem8":"s","customItem9":"s","customItem10":"s","sellerReferenceID":"s","sellerReferenceDate":"s","contractReferenceID":"s","contractAssignmentCode":"s","despatchReferenceDate":"s"}},"testdata":[{"id":"ENT-STD","name":"Shiv-PIVA (Roma)","ident":"VAT 01754930384, endpoint 0211:01754930384","setup":"None. Onboarded, regime RF01.","source":"Entities file"},{"id":"ENT-FORF","name":"QA Forfettario Test (Milano)","ident":"VAT 02345678011","setup":"Onboard an entity with tax regime RF19.","source":"Placeholder"},{"id":"BUY-B2B","name":"Shiv-CFI / Roche Diagnostics S.p.A. (Roma)","ident":"VAT 10181220152, endpoint 0210:10181220152","setup":"None. Recipient code field is blank, so payloads default to 0000000. CP-01 needs a registered code.","source":"BusinessPartners file"},{"id":"BUY-PEC","name":"QA Buyer PEC Srl (Bologna)","ident":"VAT 04567890126, PEC qa.buyer@pec.example.it","setup":"Create the partner. Use a monitored PEC address to get a real delivery receipt.","source":"Placeholder"},{"id":"BUY-PA","name":"Comune di Test (QA) (Napoli)","ident":"VAT 05678901231, office code UF0TST","setup":"Create a public-sector partner. Replace UF0TST with a real IPA test office code.","source":"Placeholder"},{"id":"BUY-EU","name":"QA GmbH (Berlin)","ident":"VAT DE123456789, endpoint 9930:DE123456789","setup":"Create a German partner. Recipient code XXXXXXX, postcode 00000.","source":"Placeholder"},{"id":"BUY-NONEU","name":"QA Imports Inc (New York)","ident":"VAT placeholder OO99999999999","setup":"Create a US partner with the non-EU placeholder VAT identifier.","source":"Placeholder"},{"id":"BUY-SM","name":"QA Operatore Sammarinese (Serravalle)","ident":"Identifier SM12345","setup":"Create a San Marino partner.","source":"Placeholder"},{"id":"BUY-CONS","name":"Mario Rossi (Roma)","ident":"Codice fiscale RSSMRA85C15H501R","setup":"Create an individual partner with no VAT number.","source":"Placeholder"},{"id":"BUY-FPRIV","name":"QA Client Particulier (Lyon)","ident":"Placeholder identifier FR-PRIV-000123","setup":"Create a French private customer.","source":"Placeholder"},{"id":"BUY-GROUP","name":"QA Gruppo IVA Holding Spa (Verona)","ident":"VAT 06789012348","setup":"Replace with a real VAT-group number from the test registry.","source":"Placeholder"}],"conventions":["Payload shape: all keys of the trimmed template, with unused fields sent as empty strings or empty arrays, exactly as in the import that passed. Compact view only hides them for reading.","Amounts follow the passing import. SupplyAmount is quantity times unit price before line allowance. Line amount equals the taxable amount. Header tax is computed per rate on the base after document-level allowance and charge, so it can differ from the sum of line taxes by a cent or two.","Document numbers are QA-<case ID>, unique per case, and auto-numbering is assumed off. Only TM-09 needs it on, and it leaves the number blank on purpose.","Dates: documents are dated 15 October 2026 unless the case says otherwise. The document date must never be in the future, so TM-07 is the only case that breaks this.","Credit notes carry positive amounts and cite the original invoice in the document references.","Reference dates inside documentReferenceDetails are sent as YYYY-MM-DD 00:00:00, which is what CGES accepts. The Import Format still says YYYY-MM-DD for that field and needs updating.","Payment details, IBAN and BIC are unchanged from the import that passed. The IBAN and BIC came from earlier test data because the Entities file has no bank details.","Contact emails are masked as example.com by default so no personal addresses sit in a shared page. The Parties panel has a switch to use the emails from your master files instead.","Parties: the entity fills Entity and BillFrom (supply type S) and the business partner fills BillTo. A partner belongs to one entity, so the panel keeps the two consistent. Scenarios that depend on a special party value keep those fields as designed.","Non-VAT lines are 77.47 or less, because stamp duty is not supported. VT-10 tab B is a reverse-charge supply and is the one deliberate exception.","Expected results state their footing: per sheet, per guides, or verify on run. Codes taken from public guides should be checked against Allegato A, version 1.9.","Self-billing (SBINV, SupplyType P): the entity is the buyer and sits in Entity and BillTo, the partner is the supplier and sits in BillFrom. Purpose is EINV, TransactionType is NORP, and the partner is whoever supplied the goods or services. BillFromRecipientCode, BillFromVatPayability and BillFromIsPublicSector are added because they are mandatory for P.","On TD16 to TD19 the entity adds 22% VAT to the supplier amount, as the integration makes the operation taxable in Italy. PaymentAmountDue is left empty because nothing is paid to the supplier through these documents.","Placeholder parties (anything marked Placeholder under Test data) use generated tax numbers with valid check digits. They are not real companies."],"open":["Net payable with withholding (ST-06, DT-07) and with split payment (PA-01): I set PaymentAmountDue to total minus withholding, and to the taxable amount for split payment. Confirm the portal rule.","Withholding uses the three fields the block offers (reason, percentage, amount) with a neutral reason text, so no withholding type code such as RT01 or RT02 reaches the XML. Confirm that is acceptable.","CIG and CUP mapping: CIG in TenderDocumentReference, CUP in ProjectReference. Confirm.","Several DDTs on one deferred invoice (DT-08) are written into DespatchDocumentReference as one string, because AdditionalDocumentRefDetails needs an attachment. Confirm the intended mapping.","Credit notes use positive amounts (DT-02, DT-03, TM-08). Confirm the portal does not expect negatives.","Recipient code: the BusinessPartners file leaves it blank, so baseline payloads send 0000000. With no PEC, SDI will answer MC rather than RC for those cases.","The business partner lists ordering document types, not invoicing, in its Peppol capabilities, so PP-01 may stay on the SDI channel.","Foreign private customers (FX-03): the identifier format is a placeholder. Confirm how the portal maps it.","Master-24 still lists the retired Peppol schemes 9906 and 9907 (PP-02). Decide whether to remove them.","Self-billing: the three BillFrom fields that are mandatory for P are not in your sample JSON. I added them with the sheet names in camelCase. Confirm the API accepts them.","TD20 (SB-05) is modelled with natura N6.9 and no VAT amount, following one guide; confirm the treatment with the tax team. TD29, SBCRN and SBDBN are not covered.","Self-billing integrations cite the supplier invoice with reference type amend, the only non-prepayment header type in Master-9. Confirm.","Test master data (see Test data) must be created before most cases can run. The three entities and six partners from your files cover only domestic business and public-administration parties, so the forfettario, foreign, consumer and VAT-group scenarios still need their own parties.","Master-data quirks found in your files (a 10-digit entity VAT number, a province mismatch, a transposed postcode) are listed on the Parties and mapping page."],"sources":{"IF":["CGES Import Format V1.1 (internal sheet)",""],"S1":["TeamSystem: cancelling/correcting a sent e-invoice","https://www.teamsystem.com/magazine/fatturazione-e-normativa/come-annullare-una-fattura-elettronica/"],"S2":["Agenda Digitale: error codes and penalties","https://www.agendadigitale.eu/documenti/fatturazione-elettronica/codici-errore-fattura-elettronica-e-sanzioni-tutti-i-casi-da-sapere/"],"S3":["Fatture in Cloud: e-invoice errors","https://www.fattureincloud.it/guida-fatturazione-elettronica/errori-fattura-elettronica/"],"S4":["Regione Lazio SSR: SDI controls (00421/22/23)","https://regione.lazio.it/sites/default/files/2021-04/Sistema-Pagamenti-SSR.pdf"],"S5":["Zucchetti: rounding controls (PrezzoTotale)","https://fattureoutsourcing.zucchetti.it/documenti/NUOVI_CONTROLLI_SU_ARROTONDAMENTI.pdf"],"S6":["Elenco dei controlli sul file fattura (SDI)","https://www.dirittobancario.it/wp-content/uploads/sites/default/files/allegati/elenco_dei_controlli_bozze.pdf"],"S7":["Informazione Fiscale: new codes 00320/00324","https://www.informazionefiscale.it/fattura-elettronica-nuovi-codici-errore-scarto"],"S8":["PMI.it: rejected invoices, codes 00400/00423","https://www.pmi.it/card/fattura-elettronica-errori-e-soluzioni/doc/10"],"S9":["Fatture in Cloud: e-invoice to the PA","https://www.fattureincloud.it/guida-fatturazione-elettronica/fattura-elettronica-pa"],"S10":["ASL Sassari: e-invoicing and split payment","https://www.asl1sassari.it/wp-content/uploads/2024/01/fatturazione-elettronica-e-split-payment-indicazioni-2024.pdf"],"S11":["Fatture in Cloud: e-invoice to foreign customers","https://www.fattureincloud.it/guida-fatturazione-elettronica/fattura-elettronica-estero/"],"S12":["Namirial: foreign e-invoices","https://focus.namirial.com/it/fatture-estere-elettroniche/"],"S13":["Fiscomania: invoices to foreign customers (00306)","https://fiscomania.com/fattura-elettronica-a-clienti-stranieri"],"S14":["Money.it: foreign e-invoice procedure","https://www.money.it/fattura-elettronica-estero-procedura-completa"],"S15":["Fatture in Cloud: deferred invoice","https://www.fattureincloud.it/glossario/fatturazione-elettronica/fattura-differita/"],"S16":["BusinessOnline: which date counts","https://www.businessonline.it/news/quale-data-di-una-fattura-elettronica-viene-considerata-fiscalmente-quella-riportata-sopra-di-invio-al-cliente-o-al-sdi_n84116.html"],"S17":["Agenda Digitale: issue deadlines","https://www.agendadigitale.eu/documenti/esperto-risponde/fattura-elettronica-i-termini-di-emissione-per-i-contribuenti-trimestrali/"],"S18":["Centro Fiscale: TD04 credit note","https://centrofiscale.com/td04-nota-credito-fattura-elettronica-2026/"],"S19":["Centro Fiscale: SDI receipts and the 5-day rule","https://centrofiscale.com/codici-errore-sdi-fattura-elettronica/"],"S20":["ecnews: PCs, consoles, microprocessors and reverse charge","https://www.ecnews.it/cessione-di-pc-console-e-microprocessori-quando-opera-lesonero-soggettivo-dal-reverse-charge/"],"S22":["Peppol Italy (AgID)","https://peppol.agid.gov.it/en/"],"S23":["Italy: the SdI system explained (Peppol in Italy)","https://econnect.eu/en/docs/knowledge/regulations/europe/italy"],"S24":["Maventa: sending in Italy","https://documentation.maventa.com/services-and-reach/italy/"],"S25":["Tot.money: withholding tax","https://tot.money/blog/ritenuta-dacconto"],"S26":["UniFe: professional fee (parcella) example","https://www.unife.it/progetto/glfe/faq/linee-guida-per-la-gestione-delle-fatture-elettroniche/allegato-3_fattura-elettronica-parcella-professionisti"],"S30":["Odoo l10n_it_edi: per-line vs global rounding","https://git.coopdevs.org/coopdevs/odoo/OCB/-/commit/d40358639f3a55f2e4c9f6378e6508a1166a102d"],"S31":["Il Sole 24 Ore: euro-only amounts and discount decimals","https://ntplusfisco.ilsole24ore.com/art/operazioni-estere-imponibile-solo-euro-AEsy67JH"],"S33":["Centro Fiscale: invoicing the PA (2026)","https://centrofiscale.com/fatturare-pubblica-amministrazione-2026/"],"S36":["Agenda Digitale: reverse charge and the new document types","https://www.agendadigitale.eu/documenti/fatturazione-elettronica/fattura-elettronica-1-6-e-reverse-charge-i-nuovi-codici/"],"S37":["Fatture in Cloud: self-invoices TD17, TD18, TD19","https://www.fattureincloud.it/glossario/fatturazione-elettronica/autofattura-td-17-18-19/"],"S38":["Namirial: issuing TD16, TD17, TD18 and TD19","https://servicedesk.namirial.com/hc/it/article_attachments/7083775892113"],"S39":["Fiscomania: self-invoices and TD20","https://fiscomania.com/autofattura-elettronica-esente-esterometro/"],"S40":["Fiscomania: reverse charge, natura N6 and integration","https://fiscomania.com/dicitura-fatture-reverse-charge/"],"S41":["SDI specification changes (codes 00471 to 00474)","https://www.lentepubblica.it/wp-content/uploads/2022/10/Variazioni-alle-specifiche-tecniche-fatture-elettroniche-2022-09-30.pdf"],"S42":["Fiscomania: April 2025 changes (TD29 and TD20)","https://fiscomania.com/fatturazione-elettronica-novita-aprile/"],"S34":["TeamSystem: e-invoicing to the PA","https://www.teamsystem.com/construction/magazine-edilizia/gare-e-appalti/fatturazione-elettronica-pa"]}}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('data').textContent);
var CASES = DATA.cases, BYID = {};
CASES.forEach(function(c){ BYID[c.id] = c; });
var GROUPS = DATA.groups;
var state = { view:'overview', q:'', type:'all', pri:'all', first:false, open:{}, tab:{}, mode:{}, entity:'', bp:'', mask:true };
var MASTER = DATA.master, ENTBY = {}, BPBY = {};
MASTER.ents.forEach(function(e){ ENTBY[e.name] = e; });
MASTER.bps.forEach(function(b){ BPBY[b.code] = b; });

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function $(sel, root){ return (root||document).querySelector(sel); }

function compactOf(full){
  var out = {};
  Object.keys(full).forEach(function(k){
    var v = full[k];
    if (k === 'items') out.items = v.map(function(it){ var r = {}; Object.keys(it).forEach(function(kk){ var x = it[kk]; if (!(x === '' || (Array.isArray(x) && !x.length))) r[kk] = x; }); return r; });
    else if (!(v === '' || (Array.isArray(v) && !v.length))) out[k] = v;
  });
  return out;
}
function pretty(v){ return JSON.stringify(v, null, 2); }
function hl(text){
  var s = esc(text).replace(/&quot;/g, '"');
  return s.replace(/("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, function(m, str, colon, lit, num){
    if (str) return colon ? '<span class="k">' + str + '</span>' + colon : '<span class="s">' + str + '</span>';
    if (lit) return '<span class="l">' + lit + '</span>';
    return '<span class="nu">' + num + '</span>';
  });
}

/* ---------- parties: write the chosen entity and partner into the payload ---------- */
function curEnt(){ return state.entity ? ENTBY[state.entity] : null; }
function curBp(){ return state.bp ? BPBY[state.bp] : null; }
function maskedEmail(kind, real){ return state.mask ? (kind === 'e' ? 'qa.entity@example.com' : 'qa.buyer@example.com') : real; }
function applyParties(o, c){
  var ent = curEnt(), bp = curBp();
  if (!ent && !bp) return o;
  var P = c.supply === 'P';
  var lock = {}; (c.locks || []).forEach(function(k){ lock[k] = 1; });
  function set(k, v){ if (!lock[k]) o[k] = v; }
  function entTo(pre){
    set(pre + 'TaxRegNo', ent.taxno); set(pre + 'LegalRegNo', ent.endpoint.replace(':', '-')); set(pre + 'LegalName', ent.name); set(pre + 'Endpoint', ent.endpoint);
    set(pre + 'StreetName', ent.street); set(pre + 'AdditionalStreetName', ent.addl); set(pre + 'City', ent.city); set(pre + 'PostCode', ent.post);
    set(pre + 'CountrySubdivision', ent.sub); set(pre + 'Country', ent.country);
    set(pre + 'ContactName', (ent.first + ' ' + ent.last).trim()); set(pre + 'ContactTelNumber', ent.tel); set(pre + 'ContactEmailAddress', maskedEmail('e', ent.email));
    if (ent.certified) set(pre + 'CertifiedEmail', state.mask ? 'qa.entity@pec.example.it' : ent.certified);
  }
  function bpTo(pre){
    set(pre + 'TaxRegNo', bp.taxno); set(pre + 'LegalRegNo', bp.legal); set(pre + 'LegalName', bp.legalName); set(pre + 'TradeName', bp.trade); set(pre + 'Endpoint', bp.endpoint);
    set(pre + 'StreetName', bp.street); set(pre + 'AdditionalStreetName', bp.addl); set(pre + 'City', bp.city); set(pre + 'PostCode', bp.post);
    set(pre + 'CountrySubdivision', bp.sub); set(pre + 'Country', bp.country);
    set(pre + 'ContactTelNumber', bp.tel); set(pre + 'ContactEmailAddress', maskedEmail('b', bp.email));
    set(pre + 'RecipientCode', bp.recipient || '0000000'); set(pre + 'VatPayability', bp.vatp); set(pre + 'IsPublicSector', bp.pa ? 'Y' : 'N');
  }
  if (ent){
    o.entityTaxRegNo = ent.taxno; o.entityName = ent.name;
    if (P){ entTo('billTo'); }
    else {
      entTo('billFrom');
      (o.paymentDetails || []).forEach(function(d){ if (d.creditPaymentAccHolderName) d.creditPaymentAccHolderName = ent.name; });
    }
  }
  if (bp){
    if (P){ bpTo('billFrom'); set('billFromContactName', ''); }
    else { bpTo('billTo'); set('billToContactName', ''); set('billToCertifiedEmail', ''); }
  }
  if (c.xform === 'same-party'){
    o.billToTaxRegNo = o.billFromTaxRegNo; o.billToLegalRegNo = o.billFromLegalRegNo; o.billToEndpoint = o.billFromEndpoint; o.billToLegalName = o.billFromLegalName;
  } else if (c.xform === 'same-party-p'){
    o.billFromTaxRegNo = o.billToTaxRegNo; o.billFromLegalRegNo = o.billToLegalRegNo; o.billFromEndpoint = o.billToEndpoint; o.billFromLegalName = o.billToLegalName;
  } else if (c.xform === 'tax-mismatch-p' && ent){
    o.billToTaxRegNo = ent.taxno.slice(0, -1) + ((+ent.taxno.slice(-1) + 1) % 10);
  } else if (c.xform === 'bad-checksum' && bp && /^\d{11}$/.test(bp.taxno)){
    o.billToTaxRegNo = bp.taxno.slice(0, 10) + ((+bp.taxno.charAt(10) + 1) % 10);
  } else if (c.xform === 'deprecated-scheme' && bp){
    o.billToEndpoint = '9907:' + bp.taxno;
  }
  return o;
}

    M.ents.map(function(e){ var n = M.bps.filter(function(b){ return b.ownerTax === e.taxno; }).length;

  h += '<div class="sect"><h3>Business partners in your file</h3><div class="tbl"><table class="mini"><thead><tr><th>Code</th><th>Belongs to</th><th>Party</th><th>Tax number</th><th>Participant ID</th><th>Recipient code</th><th>Payability</th></tr></thead><tbody>' +
    M.bps.map(function(b){ return '<tr><td><b>' + esc(b.code) + '</b></td><td>' + esc(b.ownerName) + '</td><td>' + esc(b.legalName) + (b.pa ? '<span class="tag pa">public administration</span>' : '') + '</td><td>' + esc(b.taxno) + '</td><td>' + esc(b.endpoint) + '</td><td>' + esc(b.recipient || '(empty)') + '</td><td>' + esc(b.vatp) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  h += '<div class="sect"><h3>What the file data does to the payload</h3>';
  h += '<p class="muted">Entity columns (sales: written to BillFrom)</p>' + mapTable(MAP_ENT) + '<p class="muted" style="margin-top:14px">Business partner columns (sales: written to BillTo)</p>' + mapTable(MAP_BP) + '<p class="muted" style="margin-top:14px">Self-billing (SupplyType P) flips the targets</p>' + mapTable(MAP_P) + '</div>';
  var lk = Object.keys(M.locks), xf = Object.keys(M.xform);
  h += '<div class="sect"><h3>Where a scenario keeps its own values</h3><div class="tbl"><table class="mini"><thead><tr><th>Case</th><th>Treatment</th><th>Why</th></tr></thead><tbody>' +
    lk.map(function(k){ return '<tr><td><button class="link" type="button" data-act="open" data-id="' + esc(k) + '">' + esc(k) + '</button></td><td>Kept as designed: ' + esc(M.locks[k].fields.join(', ')) + '</td><td>' + esc(M.locks[k].why) + '</td></tr>'; }).join('') +
    xf.map(function(k){ return '<tr><td><button class="link" type="button" data-act="open" data-id="' + esc(k) + '">' + esc(k) + '</button></td><td>Adjusted for the chosen parties</td><td>' + esc(M.xform[k].why) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  h += '<div class="sect"><h3>Things in the master data to look at</h3><ul class="plain">' + M.notes.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div>';
  return h;
}
function listPage(title, intro, items){
  return '<div class="wrap"><h2>' + esc(title) + '</h2><p>' + esc(intro) + '</p><ul class="plain">' + items.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
}
function sourcesView(){
  var keys = Object.keys(DATA.sources);
  return '<div class="wrap"><h2>Sources</h2><p>Public guidance consulted for the rules and SDI codes. Treat guide-derived codes as a starting point and confirm them against the Agenzia delle Entrate technical specifications (Allegato A, version 1.9).</p><ul class="plain">' +
    keys.map(function(k){ var s = DATA.sources[k]; return '<li>' + (s[1] ? '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener noreferrer">' + esc(s[0]) + '</a>' : esc(s[0])) + '</li>'; }).join('') + '</ul></div>';
}

/* ---------- navigation ---------- */
function setView(v){ state.view = v; render(); window.scrollTo(0, 0); var m = $('#main'); if (m) m.focus({preventScroll:true}); }
function render(){
  var v = state.view, html;
  if (v === 'overview') html = overviewView();
  else if (v === 'data') html = dataView();
  else if (v === 'parties') html = partiesView();
  else if (v === 'conv') html = listPage('Conventions used in every payload', 'These choices keep the payloads consistent with the import that passed.', DATA.conventions);
  else if (v === 'open') html = listPage('Points to confirm', 'Where I made an assumption, it is listed here so you can overrule it.', DATA.open);
  else if (v === 'sources') html = sourcesView();
  else if (v === 'all') html = listView('All test cases', 'Every case across all groups.', CASES);
  else { var gk = v.slice(2), g = GROUPS.filter(function(x){ return x[0] === gk; })[0]; html = listView(g[1], g[2], CASES.filter(function(c){ return c.group === gk; })); }
  $('#main').innerHTML = html;
  renderNav();
}
function renderNav(){
  var top = [['overview','Overview'],['parties','Parties and mapping'],['data','Test data'],['conv','Conventions'],['open','Points to confirm'],['sources','Sources']];
  $('#navTop').innerHTML = top.map(function(t){ return '<li><button type="button" data-act="nav" data-v="' + t[0] + '"' + (state.view === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button></li>'; }).join('');
  var gs = '<li><button type="button" data-act="nav" data-v="all"' + (state.view === 'all' ? ' aria-current="page"' : '') + '><span>All cases</span><span class="n">' + CASES.length + '</span></button></li>';
  gs += GROUPS.map(function(g){
    var n = CASES.filter(function(c){ return c.group === g[0]; }).length;
    return '<li><button type="button" data-act="nav" data-v="g:' + g[0] + '"' + (state.view === 'g:' + g[0] ? ' aria-current="page"' : '') + '><span>' + esc(g[1]) + '</span><span class="n">' + n + '</span></button></li>';
  }).join('');
  $('#navGroups').innerHTML = gs;
}
function toast(msg){ var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('on'); }, 1600); }
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(text).then(function(){ toast('Copied'); }, function(){ fallbackCopy(text); }); }
  fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Copy failed, select the text manually'); } document.body.removeChild(ta);
}
function download(name, obj){
  var blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
}
function openCase(id){
  var c = BYID[id]; if (!c) return;
  state.open[id] = true; state.view = 'g:' + c.group; state.q = ''; state.type = 'all'; state.pri = 'all'; state.first = false;
  render();
  var el = document.getElementById('c-' + id); if (el) el.scrollIntoView({ block:'start' });
}
function refreshPayload(id){ var c = BYID[id], box = document.getElementById('pv-' + id); if (box) box.innerHTML = payloadHTML(c); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  if (a === 'nav') { state.q = ''; setView(t.getAttribute('data-v')); }
  else if (a === 'toggle') { state.open[id] = !state.open[id]; var li = document.getElementById('c-' + id); var tmp = document.createElement('div'); tmp.innerHTML = caseHTML(BYID[id]); li.replaceWith(tmp.firstChild); }
  else if (a === 'tab') { state.tab[id] = +t.getAttribute('data-i'); refreshPayload(id); }
  else if (a === 'mode') { state.mode[id] = t.getAttribute('data-m'); refreshPayload(id); }
  else if (a === 'copy') { copyText(shown(BYID[id], state.tab[id] || 0)); }
  else if (a === 'dl') { var c = BYID[id], i = state.tab[id] || 0; download(id + (c.payloads.length > 1 ? '-' + (i + 1) : '') + '.json', fullObj(c, i)); }
  else if (a === 'ftype') { state.type = t.getAttribute('data-v'); render(); }
  else if (a === 'fpri') { state.pri = t.getAttribute('data-v'); render(); }
  else if (a === 'ffirst') { state.first = !state.first; render(); }
  else if (a === 'first-cut') { state.first = true; setView('all'); }
  else if (a === 'goto-data') { state.view = 'data'; render(); var r = document.getElementById('d-' + id); if (r) r.scrollIntoView({ block:'center' }); }
  else if (a === 'open') { openCase(id); }
  else if (a === 'reset-parties') { state.entity = ''; state.bp = ''; partiesChanged(); }
  else if (a === 'dl-all') { var all = {}; CASES.forEach(function(c){ all[c.id] = c.payloads.map(function(p, i){ return { label:p.label, payload:fullObj(c, i) }; }); }); download('italy-test-payloads' + (state.entity ? '_' + state.entity : '') + (state.bp ? '_' + state.bp : '') + '.json', all); }
});
document.addEventListener('input', function(e){
  if (e.target.id === 'q'){
    state.q = e.target.value; var pos = e.target.selectionStart; render();
    var q = document.getElementById('q'); if (q){ q.focus(); q.setSelectionRange(pos, pos); }
  }
});
window.addEventListener('hashchange', function(){ var id = location.hash.replace('#', ''); if (BYID[id]) openCase(id); });


/* ---------- Parties panel ---------- */
function renderParties(){
  var M = MASTER, ent = curEnt(), bp = curBp();
  var es = '<option value="">As designed in each case</option>' + M.ents.map(function(e){
    return '<option value="' + esc(e.name) + '"' + (state.entity === e.name ? ' selected' : '') + '>' + esc(e.name) + ' (' + esc(e.taxno) + ')</option>'; }).join('');
  var bs = '<option value="">As designed in each case</option>' + M.ents.map(function(e){
    var l = M.bps.filter(function(b){ return b.ownerTax === e.taxno; });
    return '<optgroup label="Partners of ' + esc(e.name) + '">' + l.map(function(b){
      return '<option value="' + esc(b.code) + '"' + (state.bp === b.code ? ' selected' : '') + '>' + esc(b.code) + ': ' + esc(b.legalName) + '</option>'; }).join('') + '</optgroup>'; }).join('');
  var st;
  if (!ent && !bp) st = 'Every case uses the parties it was designed with.';
  else {
    var n = mismatchCount();
    st = '<b>Applied to all ' + totalPayloads() + ' payloads.</b> ' + (ent ? 'Entity: ' + esc(ent.name) + '. ' : '') + (bp ? 'BillTo: ' + esc(bp.code) + '. ' : '') +
         (n ? n + ' payload' + (n === 1 ? ' was' : 's were') + ' designed for a different kind of party; open a case to see why.' : 'None of the scenarios clash with this choice.');
  }
  $('#parties').innerHTML = '<h2>Parties</h2><p class="hint">Write real master data into every payload.</p>' +
    '<label for="selEnt">Entity (Entity and BillFrom fields)</label><select id="selEnt">' + es + '</select>' +
    '<label for="selBp">Business partner (BillTo fields)</label><select id="selBp">' + bs + '</select>' +
    '<label class="chk"><input type="checkbox" id="chkMask"' + (state.mask ? ' checked' : '') + '><span>Mask contact emails as example.com</span></label>' +
    '<p class="st" role="status">' + st + '</p>' +
    ((ent || bp) ? '<button class="btn" type="button" data-act="reset-parties">Back to designed parties</button>' : '');
}
function totalPayloads(){ var n = 0; CASES.forEach(function(c){ n += c.payloads.length; }); return n; }
function partiesChanged(){ renderParties(); render(); }
document.addEventListener('change', function(e){
  var id = e.target.id;
  if (id === 'selEnt'){
    state.entity = e.target.value;
    if (state.bp && state.entity && BPBY[state.bp].ownerName !== state.entity) state.bp = '';
    partiesChanged();
  } else if (id === 'selBp'){
    state.bp = e.target.value;
    if (state.bp) state.entity = BPBY[state.bp].ownerName;
    partiesChanged();
  } else if (id === 'chkMask'){ state.mask = e.target.checked; partiesChanged(); }
});

/* theme */
function applyTheme(t){ if (t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
try { var saved = localStorage.getItem('it-theme'); if (saved) applyTheme(saved); } catch (e) {}
$('#themeBtn').addEventListener('click', function(){
  var cur = document.documentElement.getAttribute('data-theme');
  var dark = cur ? cur === 'dark' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var next = dark ? 'light' : 'dark'; applyTheme(next); try { localStorage.setItem('it-theme', next); } catch (e) {}
});
var foot = document.querySelector('.rail-foot'); var dla = document.createElement('button'); dla.className = 'btn'; dla.type = 'button'; dla.textContent = 'Download all payloads'; dla.setAttribute('data-act', 'dl-all'); foot.appendChild(dla);
$('#brandSub').textContent = 'CGES Enriched API, ' + CASES.length + ' cases, built 15 Oct 2026';
renderParties();
render();
var h0 = location.hash.replace('#', ''); if (BYID[h0]) openCase(h0);
})();
</script>
</body>
</html>
